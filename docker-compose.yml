services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: holm-open-translate
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      # Çeviri arşivi (ZIP çıktıları) konteyner yeniden başlatmalarında kalıcı kalır.
      - holm_outputs:/app/outputs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  holm_outputs:
